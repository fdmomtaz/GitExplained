<div class="flex min-h-9 items-center justify-between gap-3">
    @if (title()) {
        <h6 class="text-sm font-semibold text-muted-color">{{ title() }}</h6>
    }
    <span class="flex gap-2">
        <ng-content />
        @for (type of types(); track type) {
            <button
                pButton
                type="button"
                size="small"
                [label]="labels[type] ?? type"
                [severity]="player().canPress(type) ? undefined : 'secondary'"
                [disabled]="!player().canPress(type)"
                [class.animate-glow]="player().asks(type)"
                (click)="player().press(type)"
            ></button>
        }
    </span>
</div>
