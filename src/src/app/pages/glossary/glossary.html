<section class="flex flex-col gap-4 pt-16">
    <h1>Glossary</h1>
    <p class="max-w-xl text-xl text-pretty">
        Git's words in plain English. The lessons use the plain name first and show the Git term
        beside it.
    </p>
</section>

<section class="flex flex-col gap-16 py-20">
    @for (group of groups; track group.letter) {
        <div class="grid items-start gap-20 lg:grid-cols-3">
            <div class="text-7xl leading-none font-semibold text-primary-700">
                {{ group.letter }}
            </div>
            <div class="flex flex-col gap-8 lg:col-span-2">
                @for (t of group.terms; track t.term) {
                    <div class="grid grid-cols-12 items-baseline gap-4">
                        <div class="col-span-12 flex flex-col sm:col-span-4">
                            <span class="text-2xl leading-tight font-semibold">{{ t.term }}</span>
                            <span class="text-sm italic">{{ t.plain }}</span>
                        </div>
                        <p class="col-span-9 text-lg text-pretty sm:col-span-6">
                            {{ t.definition }}
                        </p>
                        <a
                            [routerLink]="['/lessons', t.lesson.id]"
                            class="col-span-3 justify-self-end text-sm text-primary sm:col-span-2"
                        >
                            Lesson {{ t.lesson.number }}
                        </a>
                    </div>
                }
            </div>
        </div>
    }
</section>
